# XcodeGen spec — generate the Xcode project with:  xcodegen generate
name: VigorSync
options:
  bundleIdPrefix: com.korwojci
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team in Xcode (Signing & Capabilities) or here:
    # DEVELOPMENT_TEAM: ABCDE12345
targets:
  VigorSync:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.korwojci.vigor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: VigorSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vigor Sync
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Vigor Sync reads the Health data you choose and sends it to your own Vigor server on your local network.
        NSHealthUpdateUsageDescription: Vigor Sync does not write Health data.
        NSLocalNetworkUsageDescription: Vigor Sync connects to your Vigor server on your local network.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.korwojci.vigor.refresh]
        NSAppTransportSecurity:
          # Allows plain http:// to LAN addresses and .local hostnames only (not the internet).
          NSAllowsLocalNetworking: true
