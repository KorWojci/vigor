name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vigor:ci .
      - name: Start container and probe health check
        run: |
          docker run -d --name vigor -p 3000:3000 vigor:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/healthz && exit 0; sleep 2; done
          docker logs vigor; exit 1
