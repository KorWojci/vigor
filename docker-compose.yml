# Local deployment. Data lives in the named volume `vigor-data`, mounted at /data,
# and survives `docker compose down`, container recreation and image upgrades.
# (`docker compose down -v` deletes the volume — and your data.)
services:
  vigor:
    build: .
    image: vigor:latest
    container_name: vigor
    restart: unless-stopped
    ports:
      # Reachable from other devices on your LAN (e.g. your iPhone) at http://<host-ip>:3000.
      # Use "127.0.0.1:3000:3000" instead if you put a reverse proxy in front.
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      VIGOR_DATA_DIR: /data
      TZ: ${TZ:-UTC}
    volumes:
      - vigor-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vigor-data:
